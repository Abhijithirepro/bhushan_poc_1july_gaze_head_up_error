<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gaze Detection POC</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
    h2   { margin: 0 0 16px; }

    #controls { margin-bottom: 14px; }
    button    { padding: 8px 20px; font-size: 14px; cursor: pointer; margin-right: 8px; }

    #main { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }

    /* video */
    #videoBox { position: relative; }
    video     { display: block; width: 480px; height: 360px; background: #000; }
    canvas#overlay {
      position: absolute; top: 0; left: 0;
      width: 480px; height: 360px;
      pointer-events: none;
    }

    /* right panel */
    #rightPanel { display: flex; flex-direction: column; gap: 16px; }

    /* gaze grid */
    #gazeGrid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-template-rows:    70px 70px;
      gap: 4px;
    }
    .gcell {
      display: flex; align-items: center; justify-content: center;
      background: #ddd; border: 2px solid #bbb;
      font-size: 11px; font-weight: bold; text-align: center;
      border-radius: 4px; color: #555;
      transition: background 0.15s, color 0.15s;
    }
    .gcell.active {
      background: #ff4444; color: #fff; border-color: #cc0000;
    }
    /* special colour for center = good */
    .gcell.active.center-cell { background: #22aa44; border-color: #006622; }
    /* up spans full width */
    #cell-up { grid-column: 1 / -1; }

    /* raw numbers */
    #rawBox {
      background: #fff; border: 1px solid #ccc; border-radius: 4px;
      padding: 12px 16px; font-size: 13px; line-height: 2;
      min-width: 240px;
    }
    #rawBox b { display: inline-block; width: 130px; color: #333; }

    #statusLine { font-size: 13px; color: #666; margin-top: 4px; }

    /* ── Analysis result (shown after Stop) ── */
    #result { display: none; margin-top: 24px; max-width: 860px; }
    #result h3 { margin: 0 0 12px; font-size: 16px; }

    #verdictBox {
      padding: 14px 20px; border-radius: 6px; border: 2px solid;
      font-size: 22px; font-weight: bold; letter-spacing: 1px;
      margin-bottom: 16px; display: inline-block;
    }
    .verdict-ok      { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }
    .verdict-suspect { background: #fff3e0; border-color: #e65100; color: #e65100; }
    .verdict-cheat   { background: #ffebee; border-color: #b71c1c; color: #b71c1c; }
    .verdict-unknown { background: #f5f5f5; border-color: #888;    color: #555; }

    #resultGrid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin-bottom: 16px;
    }

    .result-section {
      background: #fff; border: 1px solid #ccc; border-radius: 4px; padding: 12px 16px;
    }
    .result-section h4 { margin: 0 0 10px; font-size: 13px; color: #444; border-bottom: 1px solid #eee; padding-bottom: 6px; }

    .stat-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid #f5f5f5; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: #555; }
    .stat-val   { font-weight: bold; color: #222; }

    #factorsList { list-style: none; padding: 0; margin: 0; }
    #factorsList li {
      font-size: 12px; padding: 4px 0; border-bottom: 1px solid #f5f5f5;
      display: flex; justify-content: space-between; gap: 8px;
    }
    #factorsList li:last-child { border-bottom: none; }
    .factor-name  { color: #333; }
    .factor-val   { color: #666; font-style: italic; white-space: nowrap; }
    .factor-trig  { color: #c00; font-weight: bold; white-space: nowrap; }
    .factor-ok    { color: #888; white-space: nowrap; }

    #reasonText { font-size: 13px; color: #555; margin-top: 8px; line-height: 1.6; }
  </style>
</head>
<body>

<h2>Gaze Detection POC</h2>

<div id="controls">
  <button id="btnStart">Start</button>
  <button id="btnStop" disabled>Stop</button>
  <span id="statusLine">Press Start to begin.</span>
</div>

<div id="main">

  <!-- Video + overlay -->
  <div id="videoBox">
    <video id="vid" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="rightPanel">

    <!-- Simplified Gaze Grid: UP (full width) + LEFT / CENTER / RIGHT -->
    <div id="gazeGrid">
      <div class="gcell" id="cell-up">UP</div>

      <div class="gcell" id="cell-left">LEFT</div>
      <div class="gcell center-cell" id="cell-center">CENTER</div>
      <div class="gcell" id="cell-right">RIGHT</div>
    </div>

    <!-- Raw tracked values -->
    <div id="rawBox">
      <div><b>Gaze State:</b>   <span id="rv-gaze">—</span></div>
      <div><b>Yaw (L/R):</b>    <span id="rv-yaw">—</span></div>
      <div><b>Pitch (U/D):</b>  <span id="rv-pitch">—</span></div>
      <div><b>Jaw Open:</b>     <span id="rv-jaw">—</span></div>
      <div><b>Eye Look Down:</b><span id="rv-lookDown">—</span></div>
      <div><b>Eye Look Up:</b>  <span id="rv-lookUp">—</span></div>
      <div><b>Eye Look Out:</b> <span id="rv-lookOut">—</span></div>
      <div><b>Eye Look In:</b>  <span id="rv-lookIn">—</span></div>
      <div><b>Eye Blink:</b>    <span id="rv-blink">—</span></div>
      <div><b>Frames:</b>       <span id="rv-frames">0</span></div>
    </div>

  </div>
</div>

<!-- Analysis result — shown after Stop -->
<div id="result">
  <h3>Session Analysis Result</h3>
  <div id="verdictBox">—</div>
  <div id="resultGrid">
    <div class="result-section">
      <h4>Key Stats</h4>
      <div id="statsTable"></div>
    </div>
    <div class="result-section">
      <h4>Gaze Distribution (%)</h4>
      <div id="gazeDistTable"></div>
    </div>
    <div class="result-section" style="grid-column: 1 / -1;">
      <h4>Indicator Breakdown</h4>
      <ul id="factorsList"></ul>
    </div>
  </div>
  <div id="reasonText"></div>
</div>

<!-- MediaPipe tasks-vision -->
<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

// ── Landmark indices (from reading-detection-using-gaze.service.ts) ─────────
var LMIDX = {
  NOSE_TIP:        1,
  LEFT_EYE_OUTER:  33,
  RIGHT_EYE_OUTER: 263,
  CHIN:            152,
  FOREHEAD:        10,
};

// ── estimateYawPitchNose (exact copy from service) ───────────────────────────
function estimateYawPitchNose(landmarks) {
  var le       = landmarks[LMIDX.LEFT_EYE_OUTER];
  var re       = landmarks[LMIDX.RIGHT_EYE_OUTER];
  var nose     = landmarks[LMIDX.NOSE_TIP];
  var chin     = landmarks[LMIDX.CHIN];
  var forehead = landmarks[LMIDX.FOREHEAD];

  if (!le || !re || !nose) return { yawDeg: 0, pitchDeg: 0 };

  var eyeMidX = (le.x + re.x) / 2;
  var eyeW    = Math.abs(re.x - le.x) || 1e-6;
  var yawDeg  = ((nose.x - eyeMidX) / eyeW) * 85;

  var eyeMidY   = (le.y + re.y) / 2;
  var chinY     = chin     ? chin.y     : 0;
  var foreheadY = forehead ? forehead.y : 0;
  var faceH     = Math.abs(chinY - foreheadY) || 1e-6;
  var pitchDeg  = ((nose.y - eyeMidY) / faceH - 0.12) * 75;

  return { yawDeg: yawDeg, pitchDeg: pitchDeg };
}

// ── jawOpenScore (exact copy from service) ───────────────────────────────────
function jawOpenScore(blendshapes) {
  if (!blendshapes || !blendshapes.length) return 0;
  var cats = blendshapes[0].categories || [];
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].categoryName === 'jawOpen') return cats[i].score;
  }
  return 0;
}

// ── extractBlendshapes (exact copy from service) ─────────────────────────────
function extractBlendshapes(blendshapes) {
  var out = { eyeLookDown:0, eyeLookUp:0, eyeLookOut:0, eyeLookIn:0, eyeBlink:0 };
  if (!blendshapes || !blendshapes.length) return out;
  var cats   = blendshapes[0].categories || [];
  var scores = {};
  for (var i = 0; i < cats.length; i++) {
    scores[cats[i].categoryName] = cats[i].score;
  }
  function avg(a, b) { return ((scores[a] || 0) + (scores[b] || 0)) / 2; }
  out.eyeLookDown = avg('eyeLookDownLeft', 'eyeLookDownRight');
  out.eyeLookUp   = avg('eyeLookUpLeft',   'eyeLookUpRight');
  out.eyeLookOut  = avg('eyeLookOutLeft',  'eyeLookOutRight');
  out.eyeLookIn   = avg('eyeLookInLeft',   'eyeLookInRight');
  out.eyeBlink    = avg('eyeBlinkLeft',    'eyeBlinkRight');
  return out;
}

// ── Gaze state classification ─────────────────────────────────────────────────
// Up variants (left_up, center_up, right_up) all collapse to 'up'.
// Down variants collapse to their lateral/center equivalent (no down tracking).
function classifyGazeFromPose(yawDeg, pitchDeg) {
  var isLeft  = yawDeg >  10;   // mirrored video: positive yaw = person's left
  var isRight = yawDeg < -10;
  var isUp    = pitchDeg < -5;

  // Any upward gaze → UP regardless of lateral position
  if (isUp) return 'up';

  // Lateral only (ignore downward pitch — treat as same lateral/center level)
  if (isLeft)  return 'left';
  if (isRight) return 'right';
  return 'center';
}

// ══════════════════════════════════════════════════════════════════════════════
// Analysis logic — copied verbatim from gaze-detection.worker.ts
// (computeStats + computeVerdict + their helpers/constants)
// ══════════════════════════════════════════════════════════════════════════════

var CFG_CHEAT = {
  lat: 10.0, lrc: 4.0, mld: 3.0, away: 25.0, cad: 3.5,
  down: 18.0, dnd: 2.5, latLow: 1.5, mldLow: 2.0, latUp: 15.0,
};

var activeWeights = { lat: 3, lrc: 3, mld: 2, away: 2, cad: 1, down: 2, dnd: 1, latLow: 4, mldLow: 3, latUp: 1 };
var maxScore = 22; // sum of all weights above

var LATERAL_STATES = new Set(['left', 'left_up', 'left_down', 'right', 'right_up', 'right_down']);
var CENTER_STATES  = new Set(['center', 'center_up']);

function isLateralGaze(g) { return LATERAL_STATES.has(g); }
function isCenterLike(g)  { return CENTER_STATES.has(g); }

function computeStats(frames, duration, irisVisible) {
  var face = frames.filter(function(f) { return f.face_detected; });

  if (!face.length) {
    return {
      error: 'No face detected',
      gaze_pct: {}, lateral_per_min: 0, look_read_per_min: 0,
      lateral_max_dur: 0, center_avg_dur: 0, face_detection_rate: 0,
      iris_visible_frames: 0, gaze_visible_rate: 0,
    };
  }

  var rawCnt = {};
  for (var fi = 0; fi < face.length; fi++) {
    var fg = face[fi].gaze;
    rawCnt[fg] = (rawCnt[fg] || 0) + 1;
  }
  var tf = face.length;

  // Build runs of consecutive same-gaze
  var runs = [];
  var rs = face[0].time, rg = face[0].gaze;
  for (var i = 1; i < face.length; i++) {
    if (face[i].gaze !== rg) {
      runs.push({ gaze: rg, start: rs, end: face[i].time, dur: +((face[i].time - rs).toFixed(2)) });
      rs = face[i].time; rg = face[i].gaze;
    }
  }
  runs.push({ gaze: rg, start: rs, end: face[face.length-1].time, dur: +((face[face.length-1].time - rs).toFixed(2)) });

  // Lateral transitions
  var latAllT = 0;
  for (var j = 1; j < face.length; j++) {
    var p = face[j-1].gaze, c = face[j].gaze;
    if (c !== p && (isLateralGaze(c) || isLateralGaze(p))) latAllT++;
  }

  // Look-read cycles (non-center → center)
  var lrE = [];
  for (var k = 0; k < runs.length - 1; k++) {
    var g0 = runs[k].gaze;
    if (!isCenterLike(runs[k+1].gaze)) continue;
    if (isLateralGaze(g0)) {
      var kind = g0.indexOf('_down') >= 0 ? 'down_lateral' : g0.indexOf('_up') >= 0 ? 'up_lateral' : 'lateral';
      lrE.push({ time: +(runs[k].start.toFixed(1)), dir: g0, away_dur: runs[k].dur, kind: kind });
    } else if (g0 === 'down') {
      lrE.push({ time: +(runs[k].start.toFixed(1)), dir: 'down', away_dur: runs[k].dur, kind: 'down' });
    }
  }

  var cRuns    = runs.filter(function(r) { return isCenterLike(r.gaze); });
  var dRuns    = runs.filter(function(r) { return r.gaze === 'down'; });
  var lAllRuns = runs.filter(function(r) { return isLateralGaze(r.gaze); });
  var lEyeRuns = runs.filter(function(r) { return r.gaze === 'left' || r.gaze === 'right'; });
  var lUpRuns  = runs.filter(function(r) { return r.gaze === 'left_up'   || r.gaze === 'right_up'; });
  var lDnRuns  = runs.filter(function(r) { return r.gaze === 'left_down' || r.gaze === 'right_down'; });

  var dm = Math.max(duration / 60, 0.01);

  function maxDur(arr) {
    if (!arr.length) return 0;
    var m = 0;
    for (var i = 0; i < arr.length; i++) { if (arr[i].dur > m) m = arr[i].dur; }
    return +m.toFixed(2);
  }
  function avgDur(arr) {
    if (!arr.length) return 0;
    var s = 0;
    for (var i = 0; i < arr.length; i++) { s += arr[i].dur; }
    return +(s / arr.length).toFixed(2);
  }

  var cntCenter = (rawCnt['center'] || 0) + (rawCnt['center_up'] || 0);
  var cntLeft   = (rawCnt['left']   || 0) + (rawCnt['left_up']   || 0) + (rawCnt['left_down']  || 0);
  var cntRight  = (rawCnt['right']  || 0) + (rawCnt['right_up']  || 0) + (rawCnt['right_down'] || 0);
  var cntDown   = rawCnt['down'] || 0;
  var cntAway   = rawCnt['away'] || 0;

  return {
    total_frames:         frames.length,
    face_detected_frames: tf,
    face_detection_rate:  +(tf / frames.length).toFixed(3),
    iris_visible_frames:  irisVisible,
    gaze_visible_rate:    +(irisVisible / frames.length).toFixed(3),
    gaze_pct: {
      center:     +(cntCenter / tf * 100).toFixed(1),
      left:       +(cntLeft   / tf * 100).toFixed(1),
      right:      +(cntRight  / tf * 100).toFixed(1),
      down:       +(cntDown   / tf * 100).toFixed(1),
      away:       +(cntAway   / tf * 100).toFixed(1),
      center_up:  +((rawCnt['center_up']  || 0) / tf * 100).toFixed(1),
      left_up:    +((rawCnt['left_up']    || 0) / tf * 100).toFixed(1),
      left_down:  +((rawCnt['left_down']  || 0) / tf * 100).toFixed(1),
      right_up:   +((rawCnt['right_up']   || 0) / tf * 100).toFixed(1),
      right_down: +((rawCnt['right_down'] || 0) / tf * 100).toFixed(1),
    },
    lateral_per_min:      +(latAllT        / dm).toFixed(2),
    look_read_per_min:    +(lrE.length     / dm).toFixed(2),
    lateral_max_dur:      maxDur(lAllRuns),
    down_max_dur:         maxDur(dRuns),
    lateral_avg_dur:      avgDur(lAllRuns),
    center_avg_dur:       avgDur(cRuns),
    lateral_transitions:  latAllT,
    look_read_cycles:     lrE.length,
    runs:                 runs.slice(0, 500),
    lrEvents:             lrE.slice(0, 100),
    lateral_pct: {
      eye_level: +(((rawCnt['left']     || 0) + (rawCnt['right']     || 0)) / tf * 100).toFixed(1),
      upper:     +(((rawCnt['left_up']  || 0) + (rawCnt['right_up']  || 0)) / tf * 100).toFixed(1),
      lower:     +(((rawCnt['left_down']|| 0) + (rawCnt['right_down']|| 0)) / tf * 100).toFixed(1),
    },
    lateral_eye_per_min:  +(lEyeRuns.length / dm).toFixed(2),
    lateral_up_per_min:   +(lUpRuns.length  / dm).toFixed(2),
    lateral_down_per_min: +(lDnRuns.length  / dm).toFixed(2),
    lateral_eye_max_dur:  maxDur(lEyeRuns),
    lateral_up_max_dur:   maxDur(lUpRuns),
    lateral_down_max_dur: maxDur(lDnRuns),
    look_read_down_per_min: +(lrE.filter(function(e){ return e.kind==='down'||e.kind==='down_lateral'; }).length / dm).toFixed(2),
    look_read_up_per_min:   +(lrE.filter(function(e){ return e.kind==='up_lateral'; }).length / dm).toFixed(2),
  };
}

function computeVerdict(stats) {
  if (stats.error) {
    return { label: 'UNKNOWN', confidence: 0, color: 'orange', reason: stats.error, factors: [] };
  }

  var tLat=CFG_CHEAT.lat, tLrc=CFG_CHEAT.lrc, tMld=CFG_CHEAT.mld, tAway=CFG_CHEAT.away,
      tCad=CFG_CHEAT.cad, tDown=CFG_CHEAT.down, tDnd=CFG_CHEAT.dnd,
      tLatLow=CFG_CHEAT.latLow, tMldLow=CFG_CHEAT.mldLow, tLatUp=CFG_CHEAT.latUp;

  var score = 0;
  var factors = [];

  function addF(name, val, thresh, trig, w, sev) {
    if (trig) score += w;
    factors.push({ name: name, value: val, threshold: thresh, triggered: trig, severity: trig ? sev : 'none' });
  }

  var aw  = stats.gaze_pct.away || 0;
  var fdr = stats.face_detection_rate || 0;
  var usablePct = Math.max(0, 100 - aw);
  var qualityOK = fdr >= 0.75 && aw <= 55;

  var lat    = stats.lateral_eye_per_min  != null ? stats.lateral_eye_per_min  : (stats.lateral_per_min || 0);
  var mld    = stats.lateral_eye_max_dur  != null ? stats.lateral_eye_max_dur  : (stats.lateral_max_dur || 0);
  var latLow = stats.lateral_down_per_min != null ? stats.lateral_down_per_min : 0;
  var mldLow = stats.lateral_down_max_dur != null ? stats.lateral_down_max_dur : 0;
  var latUp  = stats.lateral_up_per_min   != null ? stats.lateral_up_per_min   : 0;
  var lrc    = stats.look_read_per_min || 0;
  var cad    = stats.center_avg_dur    || 0;
  var dn     = stats.gaze_pct.down     || 0;
  var dnd    = stats.down_max_dur      || 0;

  var trigLat    = qualityOK && lat    >= tLat;
  var trigLrc    = lrc >= tLrc;
  var trigMld    = qualityOK && mld    >= tMld;
  var trigLatLow = qualityOK && latLow >= tLatLow;
  var trigMldLow = qualityOK && mldLow >= tMldLow;
  var trigLatUp  = qualityOK && latUp  >= tLatUp;
  var hasReadingEvidence =
    trigLrc || (qualityOK && dn >= tDown) || trigLatLow || trigMldLow ||
    (qualityOK && mld >= Math.max(tMld, 6) && lat >= tLat * 1.1);
  var trigAway = aw >= tAway && hasReadingEvidence && aw <= 85;
  var trigCad  = qualityOK && cad > 0 && cad < tCad;
  var trigDown = qualityOK && dn  >= tDown;
  var trigDnd  = qualityOK && dnd >= tDnd;

  addF('Lateral Gaze Frequency',           lat    + '/min', '>'  + tLat    + '/min', trigLat,    activeWeights.lat,    lat    >= tLat*1.4    ? 'high' : 'medium');
  addF('Look-Read Cycles',                 lrc    + '/min', '>'  + tLrc    + '/min', trigLrc,    activeWeights.lrc,    lrc    >= tLrc*1.4    ? 'high' : 'medium');
  addF('Sustained Lateral Gaze',           mld    + 's',    '>'  + tMld    + 's',    trigMld,    activeWeights.mld,    mld    >= 8           ? 'high' : 'medium');
  addF('Away Gaze / Head Turning',         aw     + '%',    '>'  + tAway   + '%',    trigAway,   activeWeights.away,   aw     >= tAway*1.3   ? 'high' : 'medium');
  addF('Short Attention Span',             cad    + 's avg','<'  + tCad    + 's avg',trigCad,    activeWeights.cad,    'medium');
  addF('Down Gaze (Reading Below)',        dn     + '%',    '>'  + tDown   + '%',    trigDown,   activeWeights.down,   dn     >= tDown*1.3   ? 'high' : 'medium');
  addF('Sustained Down Gaze',              dnd    + 's',    '>'  + tDnd    + 's',    trigDnd,    activeWeights.dnd,    dnd    >= 6           ? 'high' : 'medium');
  addF('Lower Lateral Gaze (Phone/Notes)', latLow + '/min', '>'  + tLatLow + '/min', trigLatLow, activeWeights.latLow, latLow >= tLatLow*2   ? 'high' : 'medium');
  addF('Sustained Lower Lateral Gaze',    mldLow + 's',    '>'  + tMldLow + 's',    trigMldLow, activeWeights.mldLow, mldLow >= 4           ? 'high' : 'medium');
  addF('Upper Lateral Gaze (Thinking)',    latUp  + '/min', '>'  + tLatUp  + '/min', trigLatUp,  activeWeights.latUp,  'low');

  var qualityPenalty = qualityOK ? 0 : Math.min(22, Math.round(Math.max(0, aw-55)*0.25 + (0.75 - Math.min(0.75, fdr))*30));
  var cRaw  = maxScore > 0 ? (score / maxScore) * 100 : 0;
  var nTrig = factors.filter(function(f){ return f.triggered; }).length;

  var primaryEvidence =
    trigLrc || trigDown || trigDnd || trigLatLow || trigMldLow ||
    (qualityOK && mld >= Math.max(tMld, 6) && lat >= tLat * 1.2);

  var label, color, confidence;
  if (!qualityOK && !primaryEvidence) {
    label = 'CAN NOT EVALUATE'; color = 'unknown'; confidence = 0;
  } else if (score >= 7 && primaryEvidence) {
    label = 'CHEATING DETECTED'; color = 'cheat';
    confidence = Math.min(98, Math.max(55, Math.round(60 + cRaw*0.4 - qualityPenalty)));
  } else if (score >= 4 || (score >= 7 && !primaryEvidence)) {
    label = 'SUSPICIOUS BEHAVIOR'; color = 'suspect';
    confidence = Math.max(30, Math.round(40 + cRaw*0.35 - qualityPenalty));
  } else {
    label = 'NO CHEATING DETECTED'; color = 'ok';
    confidence = Math.min(97, Math.max(55, Math.round(68 + (1-cRaw/100)*29 - qualityPenalty)));
  }

  // Flip confidence to cheating-mode
  var nonCheatConf = confidence;
  if (color === 'ok' || color === 'unknown') {
    confidence = Math.max(0, Math.min(100, 100 - nonCheatConf));
  }

  var tNames = factors.filter(function(f){ return f.triggered; }).map(function(f){ return f.name; });

  return {
    label: label, color: color, confidence: confidence,
    score: score, max_score: maxScore, triggered_count: nTrig,
    reason: nTrig + '/' + factors.length + ' indicators triggered' +
      (tNames.length ? ': ' + tNames.join(', ') : ' — none') +
      (qualityOK ? '' : ' · Low quality (face ' + Math.round(fdr*100) + '%, away ' + aw + '%, usable ' + usablePct + '%)'),
    factors: factors,
  };
}

// ── Show analysis result ──────────────────────────────────────────────────────
function showResult(recordedFrames, durationSec) {
  var stats   = computeStats(recordedFrames, durationSec, recordedFrames.filter(function(f){ return f.face_detected; }).length);
  var verdict = computeVerdict(stats);

  var resultDiv  = document.getElementById('result');
  var verdictBox = document.getElementById('verdictBox');

  // Verdict box
  verdictBox.textContent = verdict.label + '  (' + verdict.confidence + '% confidence)';
  verdictBox.className   = 'verdict-' + verdict.color;

  // Key stats
  var statsHtml = '';
  function row(label, val) { return '<div class="stat-row"><span class="stat-label">' + label + '</span><span class="stat-val">' + val + '</span></div>'; }
  statsHtml += row('Duration',              durationSec.toFixed(1) + 's');
  statsHtml += row('Total frames',          stats.total_frames);
  statsHtml += row('Face detected',         stats.face_detected_frames + ' (' + (stats.face_detection_rate*100).toFixed(0) + '%)');
  statsHtml += row('Lateral gaze /min',     stats.lateral_eye_per_min != null ? stats.lateral_eye_per_min : stats.lateral_per_min);
  statsHtml += row('Look-read cycles /min', stats.look_read_per_min);
  statsHtml += row('Max sustained lateral', stats.lateral_eye_max_dur != null ? stats.lateral_eye_max_dur + 's' : stats.lateral_max_dur + 's');
  statsHtml += row('Max sustained down',    stats.down_max_dur + 's');
  statsHtml += row('Center avg dur',        stats.center_avg_dur + 's');
  statsHtml += row('Score',                 verdict.score + ' / ' + verdict.max_score);
  document.getElementById('statsTable').innerHTML = statsHtml;

  // Gaze distribution
  var gp = stats.gaze_pct || {};
  var distHtml = '';
  var gazePairs = [
    ['Center',      (+(gp.center||0) + +(gp.center_up||0)).toFixed(1)],
    ['↑ Center Up', gp.center_up   || 0],
    ['← Left',      gp.left        || 0],
    ['↖ Left Up',   gp.left_up     || 0],
    ['↙ Left Down', gp.left_down   || 0],
    ['→ Right',     gp.right       || 0],
    ['↗ Right Up',  gp.right_up    || 0],
    ['↘ Right Down',gp.right_down  || 0],
    ['↓ Down',      gp.down        || 0],
    ['✕ Away',      gp.away        || 0],
  ];
  for (var gi = 0; gi < gazePairs.length; gi++) {
    distHtml += row(gazePairs[gi][0], gazePairs[gi][1] + '%');
  }
  document.getElementById('gazeDistTable').innerHTML = distHtml;

  // Factors
  var fList = document.getElementById('factorsList');
  fList.innerHTML = '';
  for (var fi = 0; fi < verdict.factors.length; fi++) {
    var f = verdict.factors[fi];
    var li = document.createElement('li');
    li.innerHTML =
      '<span class="factor-name">' + f.name + '</span>' +
      '<span class="factor-val">' + f.value + ' (thresh ' + f.threshold + ')</span>' +
      (f.triggered
        ? '<span class="factor-trig">▲ TRIGGERED</span>'
        : '<span class="factor-ok">✓ ok</span>');
    fList.appendChild(li);
  }

  document.getElementById('reasonText').textContent = verdict.reason;
  resultDiv.style.display = 'block';
}

// ══════════════════════════════════════════════════════════════════════════════
// DOM refs + detection state
// ══════════════════════════════════════════════════════════════════════════════

// ── DOM refs ─────────────────────────────────────────────────────────────────
var vid        = document.getElementById('vid');
var overlay    = document.getElementById('overlay');
var ctx        = overlay.getContext('2d');
var btnStart   = document.getElementById('btnStart');
var btnStop    = document.getElementById('btnStop');
var statusLine = document.getElementById('statusLine');

// ── State ────────────────────────────────────────────────────────────────────
var landmarker      = null;
var stream          = null;
var intervalId      = null;
var frameCount      = 0;
var capCanvas       = document.createElement('canvas');
var capCtx          = capCanvas.getContext('2d');
var prevGaze        = null;
var recordedFrames  = [];   // { time, face_detected, gaze }
var sessionStartMs  = 0;

// ── Highlight gaze grid cell ─────────────────────────────────────────────────
function highlightGaze(gaze) {
  if (gaze === prevGaze) return;
  prevGaze = gaze;

  var cells = document.querySelectorAll('.gcell');
  for (var i = 0; i < cells.length; i++) {
    cells[i].classList.remove('active');
  }
  var el = document.getElementById('cell-' + gaze);
  if (el) el.classList.add('active');
}

// ── Update raw values panel ───────────────────────────────────────────────────
function updateRaw(gaze, yaw, pitch, jaw, blends) {
  document.getElementById('rv-gaze').textContent     = gaze.toUpperCase().replace('_', ' ');
  document.getElementById('rv-yaw').textContent      = yaw.toFixed(2) + '°';
  document.getElementById('rv-pitch').textContent    = pitch.toFixed(2) + '°';
  document.getElementById('rv-jaw').textContent      = jaw.toFixed(3);
  document.getElementById('rv-lookDown').textContent = blends.eyeLookDown.toFixed(3);
  document.getElementById('rv-lookUp').textContent   = blends.eyeLookUp.toFixed(3);
  document.getElementById('rv-lookOut').textContent  = blends.eyeLookOut.toFixed(3);
  document.getElementById('rv-lookIn').textContent   = blends.eyeLookIn.toFixed(3);
  document.getElementById('rv-blink').textContent    = blends.eyeBlink.toFixed(3);
  document.getElementById('rv-frames').textContent   = frameCount;
}

// ── Capture one frame and run detection ──────────────────────────────────────
function captureAndProcess() {
  if (!vid || vid.readyState < 2) return;
  var vw = vid.videoWidth, vh = vid.videoHeight;
  if (!vw || !vh) return;

  // Resize canvas to 320px wide (same as service)
  var scale = 320 / vw;
  var dw = 320, dh = Math.round(vh * scale);
  if (capCanvas.width !== dw)  capCanvas.width  = dw;
  if (capCanvas.height !== dh) capCanvas.height = dh;
  capCtx.drawImage(vid, 0, 0, dw, dh);

  createImageBitmap(capCanvas).then(function(bitmap) {
    var result;
    try { result = landmarker.detect(bitmap); }
    catch(e) { result = { faceLandmarks: [], faceBlendshapes: [] }; }
    bitmap.close();

    frameCount++;
    var tSec = (Date.now() - sessionStartMs) / 1000;

    if (!result.faceLandmarks || !result.faceLandmarks.length) {
      // Record a no-face frame (same as worker does)
      recordedFrames.push({ time: +tSec.toFixed(2), face_detected: false, gaze: 'no_face' });
      highlightGaze('center');
      return;
    }

    var lm     = result.faceLandmarks[0];
    var pose   = estimateYawPitchNose(lm);
    var jaw    = jawOpenScore(result.faceBlendshapes);
    var blends = extractBlendshapes(result.faceBlendshapes);
    var gaze   = classifyGazeFromPose(pose.yawDeg, pose.pitchDeg);

    // Record frame — same shape computeStats expects
    recordedFrames.push({ time: +tSec.toFixed(2), face_detected: true, gaze: gaze });

    highlightGaze(gaze);
    updateRaw(gaze, pose.yawDeg, pose.pitchDeg, jaw, blends);

    // Draw dots on key landmarks
    overlay.width  = vid.offsetWidth  || 480;
    overlay.height = vid.offsetHeight || 360;
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    var scaleX = overlay.width  / vw;
    var scaleY = overlay.height / vh;

    // flip X because video is mirrored
    ctx.fillStyle = '#00ff88';
    var keys = [1,33,263,152,10,61,291,4,468,473];
    for (var i = 0; i < keys.length; i++) {
      var pt = lm[keys[i]];
      if (!pt) continue;
      var px = (1 - pt.x) * vw * scaleX;  // mirror
      var py = pt.y * vh * scaleY;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();
    }

  }).catch(function() {});
}

// ── Start ─────────────────────────────────────────────────────────────────────
btnStart.addEventListener('click', async function() {
  btnStart.disabled = true;
  statusLine.textContent = 'Requesting camera...';

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  } catch(e) {
    statusLine.textContent = 'Camera error: ' + e.message;
    btnStart.disabled = false;
    return;
  }

  vid.srcObject = stream;
  await new Promise(function(res) { vid.onloadeddata = res; });

  if (!landmarker) {
    statusLine.textContent = 'Loading face model (first time ~10s)...';
    try {
      var vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'CPU'
        },
        runningMode:                'IMAGE',
        numFaces:                   1,
        outputFaceBlendshapes:      true,
        minFaceDetectionConfidence: 0.4,
        minFacePresenceConfidence:  0.4,
      });
    } catch(e) {
      statusLine.textContent = 'Model load failed: ' + e.message;
      btnStart.disabled = false;
      return;
    }
  }

  frameCount      = 0;
  prevGaze        = null;
  recordedFrames  = [];
  sessionStartMs  = Date.now();
  document.getElementById('result').style.display = 'none';
  statusLine.textContent = 'Running at 3 FPS…';
  btnStop.disabled = false;

  // 3 FPS = 333ms interval (same as service targetFPS:3)
  intervalId = setInterval(captureAndProcess, 333);
});

// ── Stop ──────────────────────────────────────────────────────────────────────
btnStop.addEventListener('click', function() {
  clearInterval(intervalId);
  intervalId = null;

  var durationSec = (Date.now() - sessionStartMs) / 1000;

  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  vid.srcObject = null;
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  statusLine.textContent = 'Stopped. Analyzing ' + recordedFrames.length + ' frames…';
  btnStop.disabled  = true;
  btnStart.disabled = false;

  // Run analysis (same logic as the worker on 'stop' message)
  showResult(recordedFrames, durationSec);
  statusLine.textContent = 'Done. See analysis below.';
});
</script>
